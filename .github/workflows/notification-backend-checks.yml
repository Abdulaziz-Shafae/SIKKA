name: Notification backend checks
on:
  push:
    branches:
      - feature/notifications-approved-20261103
  pull_request:
    branches:
      - feature/notifications-from-brevo
      - deployment/brevo-railway
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and package
        run: mvn -B -ntp -DskipTests package
      - name: Unit and integration tests
        run: mvn -B -ntp test
