name: Validate Sikka Backend (testing)
on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 scripts/check_park_patterns.py
      # Uses src/test/resources/application.properties (H2). MySQL/production credentials are untouched.
      - run: bash mvnw --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-backend-test-reports
          path: target/surefire-reports/
