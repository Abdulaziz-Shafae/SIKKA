spring.application.name=sikka

spring.datasource.url=jdbc:mysql://localhost:3306/sikka
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.timeout-seconds=90

aladhan.calculation-method=4
aladhan.timeout-seconds=15

# Map routes are estimates; configure a verified graph entrance before generating itineraries.
sikka.map.walking-meters-per-minute=${SIKKA_WALKING_METERS_PER_MINUTE:70}
sikka.map.entrance-node-id=${SIKKA_ENTRANCE_NODE_ID:11}


