spring.application.name=sikka

spring.datasource.url=jdbc:mysql://localhost:3307/sikka
spring.datasource.username=root
spring.datasource.password=Asdf@1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.timeout-seconds=90

aladhan.calculation-method=4
aladhan.timeout-seconds=15

# Map routes are estimates; configure a verified graph entrance before generating itineraries.
sikka.map.walking-meters-per-minute=${SIKKA_WALKING_METERS_PER_MINUTE:70}
sikka.map.entrance-node-id=155

spring.jpa.properties.hibernate.max_fetch_depth=0

# Test coordinates only — not verified park coordinates
sikka.park.latitude=24.7000
sikka.park.longitude=46.6000